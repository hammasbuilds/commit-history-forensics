[project]
name = "commit-history-forensics"
version = "0.1.0"
description = "Detect fabricated git histories from structural signals: timestamp skew, uniformity, cadence."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
# `chf-score <repo-or-folder> [--json]`, the same as `python src/score.py`.
chf-score = "src.score:main"

# Both, deliberately. `uv sync --all-groups` (what CI and the Makefile use) reads the
# dependency group; `pip install -e ".[dev]"` (what the README also documents) reads
# the extra and, since it was empty, silently installed nothing - the Makefile's own
# `make install` target then "succeeded" having installed nothing but the base package.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[dependency-groups]
# ruff pinned to a minor range: the formatter changes between minor versions, so an
# open bound means CI reformats differently from the committed code.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
